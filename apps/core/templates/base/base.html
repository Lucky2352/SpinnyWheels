{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}spinnyWheels{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        slate: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }
    </style>
    <script>
        window.AutoFlowConfig = {
            supabaseUrl: "{{ supabase_url|default:''|escapejs }}",
            supabasePublishableKey: "{{ supabase_publishable_key|default:''|escapejs }}",
            apiBaseUrl: "{{ api_base_url|default:'/api/'|escapejs }}"
        };
    </script>
    <script src="{% static 'js/supabase.js' %}"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-50 min-h-screen" data-protected-page="{% if protected_page %}true{% else %}false{% endif %}">
    {% block content %}{% endblock %}

    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/common.js' %}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
